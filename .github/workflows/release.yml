name: Build and Release Md-101

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows (VST3, Standalone & Installer)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -A x64 -DMD101_BUILD_TESTS=ON

      - name: Build Md-101 (Release)
        run: cmake --build build --config Release --parallel

      - name: Diagnose DLL Imports on Failure
        if: failure()
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "C:/Program Files/Microsoft Visual Studio" -Recurse -Filter "dumpbin.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*Hostx64\x64*" } | Select-Object -First 1 -ExpandProperty FullName
          $vst3 = "build/Md101_artefacts/Release/VST3/Md-101.vst3/Contents/x86_64-win/Md-101.vst3"
          if ($dumpbin -and (Test-Path $vst3)) {
            & $dumpbin /dependents $vst3
            & $dumpbin /imports $vst3 | Select-String -Pattern "\.dll|Ordinal" -Context 0,1
          }

      - name: Run Automated Verification Tests
        shell: pwsh
        run: |
          if (Test-Path "build/Release/Md101Verify.exe") {
            ./build/Release/Md101Verify.exe
          } else {
            ./build/Md101Verify.exe
          }

      - name: Build Windows Installer (.exe) & Portable Package (.zip)
        shell: powershell
        run: |
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.1.1" }
          .\build_installer_windows.ps1 -BuildType Release -Version $version

      - name: Verify Silent Windows Installer & Uninstaller
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.1.1" }
          $setupExe = "$PWD/dist/Md-101-$version-Windows-x64-Setup.exe"
          $testAppDir = "$env:RUNNER_TEMP\md101-app"
          $testVstDir = "$env:RUNNER_TEMP\md101-vst3"
          $p1 = Start-Process -FilePath $setupExe -ArgumentList @("/S", "/DIR=$testAppDir", "/VST3DIR=$testVstDir") -Wait -PassThru
          if ($p1.ExitCode -ne 0) { throw "Setup.exe exited with code $($p1.ExitCode)" }
          if (-not (Test-Path "$testVstDir\Md-101.vst3\Contents\x86_64-win\Md-101.vst3")) {
            throw "VST3 plugin was not installed by Setup.exe"
          }
          if (-not (Test-Path "$testAppDir\Md-101.exe")) {
            throw "Standalone Md-101.exe was not installed by Setup.exe"
          }
          $p2 = Start-Process -FilePath "$testAppDir\Uninstall-Md-101.exe" -ArgumentList @("/S", "/DIR=$testAppDir", "/VST3DIR=$testVstDir") -Wait -PassThru
          if ($p2.ExitCode -ne 0) { throw "Uninstall-Md-101.exe exited with code $($p2.ExitCode)" }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 7

  build-linux:
    name: Build Linux (VST3, Standalone, .deb & .run Installer)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Audio & GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config dpkg-dev \
            libasound2-dev libfreetype6-dev libx11-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libxcomposite-dev mesa-common-dev

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMD101_BUILD_TESTS=ON

      - name: Build Md-101 (Release)
        run: cmake --build build --parallel $(nproc)

      - name: Run Automated Verification Tests
        run: ./build/Md101Verify

      - name: Build Linux Installers (.run, .deb, .tar.gz)
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.1.1}"
          chmod +x build_installer_linux.sh installer/linux/*.sh
          ./build_installer_linux.sh Release "${VERSION}"

      - name: Verify Linux .run Installer & .deb Package
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.1.1}"
          ./dist/Md-101-${VERSION}-Linux-x64-Installer.run --user --yes
          test -d "${HOME}/.vst3/Md-101.vst3"
          test -x "${HOME}/.local/bin/Md-101"
          "${HOME}/.local/bin/md-101-uninstall" --user --yes
          test ! -d "${HOME}/.vst3/Md-101.vst3"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dist/*.run
            dist/*.deb
            dist/*.tar.gz
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: release-assets

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Md-101 ${{ github.ref_name }} — Sintetizador da Tabela Periódica
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
