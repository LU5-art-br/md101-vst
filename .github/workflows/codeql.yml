name: CodeQL & PR Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze-cpp:
    name: CodeQL C/C++ & Automated Tests
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Audio & GUI Dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            ninja-build \
            libasound2-dev libfreetype6-dev libx11-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libxcomposite-dev mesa-common-dev

      - name: Initialize CodeQL (C/C++)
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml

      - name: Configure and Build Md-101 + Tests
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMD101_BUILD_TESTS=ON
          cmake --build build --parallel $(nproc)

      - name: Run Automated Verification Tests
        run: ./build/Md101Verify

      - name: Perform CodeQL Analysis (C/C++)
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"

  analyze-csharp:
    name: CodeQL C# (Windows Setup)
    runs-on: windows-2022
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL (C#)
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Compile Windows SetupProgram.cs (.NET Framework 4.x)
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) {
            throw "csc.exe not found at $csc"
          }
          $outExe = Join-Path $env:RUNNER_TEMP "Md101SetupCheck.exe"
          & $csc /nologo /target:winexe /platform:x64 /optimize+ `
            "/out:$outExe" `
            /r:System.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll `
            /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll `
            "installer\windows\SetupProgram.cs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Perform CodeQL Analysis (C#)
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
